name: Feature idea
description: Suggest a view, metric or workflow improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas can also start in [Discussions → Ideas](https://github.com/Manubown/agent-monitor/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to see or do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Sketches are welcome (no screenshots of private sessions).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other designs you thought about.
