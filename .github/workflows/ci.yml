name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]
        include:
          # The engines floor (first release with node:sqlite unflagged) and the next LTS, on one OS.
          - os: ubuntu-latest
            node: 22.13.0
          - os: ubuntu-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    env:
      # CI tests the addon built from this commit, never a downloaded release asset.
      AGENT_MONITOR_BUILD_FROM_SOURCE: "1"
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/search

      - run: pnpm install --frozen-lockfile

      - name: pnpm check (addon + typecheck + tests)
        run: pnpm check

      - name: next build
        run: pnpm exec next build
