name: Release

# Pushing a tag v<version> (matching package.json) builds the search addon for every supported
# platform and attaches the binaries plus SHA256SUMS to the GitHub release. scripts/build-native.mjs
# downloads them from there, so asset names and the checksum file format are a contract with it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

  addon:
    name: addon (${{ matrix.platform }}-${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux on 22.04 so the binaries load on glibc >= 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux, arch: x64, lib: libagent_monitor_search.so, smoke: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux, arch: arm64, lib: libagent_monitor_search.so, smoke: true }
          - { os: macos-14, target: aarch64-apple-darwin, platform: darwin, arch: arm64, lib: libagent_monitor_search.dylib, smoke: true }
          # Cross-compiled on Apple silicon; the arm64 Node there cannot load it.
          - { os: macos-14, target: x86_64-apple-darwin, platform: darwin, arch: x64, lib: libagent_monitor_search.dylib, smoke: false }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, platform: win32, arch: x64, lib: agent_monitor_search.dll, smoke: true }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --manifest-path native/search/Cargo.toml --target ${{ matrix.target }}

      - name: Name asset
        shell: bash
        run: |
          mkdir -p dist
          cp "native/search/target/${{ matrix.target }}/release/${{ matrix.lib }}" \
            "dist/agent_monitor_search-${{ matrix.platform }}-${{ matrix.arch }}.node"

      - uses: actions/setup-node@v5
        if: matrix.smoke
        with:
          node-version: 22.x

      - name: Smoke test (load addon, open an index)
        if: matrix.smoke
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), os = require("os"), path = require("path");
            const mod = { exports: {} };
            process.dlopen(mod, path.resolve(process.argv[1]));
            const index = new mod.exports.SearchIndex(fs.mkdtempSync(path.join(os.tmpdir(), "am-search-")));
            if (index.docCount() !== 0) throw new Error("fresh index is not empty");
            console.log("addon ok");
          ' "dist/agent_monitor_search-${{ matrix.platform }}-${{ matrix.arch }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.node
          if-no-files-found: error

  publish:
    name: publish release
    needs: addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum agent_monitor_search-*.node > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-alpha*|*-beta*) prerelease=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/agent_monitor_search-*.node dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/agent_monitor_search-*.node dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
